<!doctype html>
<html lang="pt-BR">
<body style="margin:0;background:#f7f8fa;font-family:Montserrat,Arial,sans-serif;color:#102952">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:32px 12px">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border-radius:16px;padding:36px 32px;border:1px solid #e3e8f0">
        <tr><td style="font-family:Georgia,serif;letter-spacing:4px;font-size:18px;text-align:center;padding-bottom:20px">VIA<span style="color:#4DA6E7">MUNDI</span></td></tr>
        <tr><td style="font-family:Georgia,serif;font-size:22px;text-align:center;padding-bottom:12px">Seu acesso ao painel</td></tr>
        <tr><td style="font-size:14px;line-height:1.6;color:#4a5570;text-align:center;padding-bottom:24px">Use o código abaixo ou clique no botão. Ele expira em 15 minutos e só funciona uma vez.</td></tr>
        <tr><td style="font-size:34px;letter-spacing:10px;font-weight:700;text-align:center;padding-bottom:24px;font-family:'Courier New',monospace">{{ .Token }}</td></tr>
        <tr><td align="center" style="padding-bottom:24px">
          <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#102952;color:#ffffff;text-decoration:none;font-weight:600;font-size:14px;padding:12px 28px;border-radius:999px">Entrar no painel</a>
        </td></tr>
        <tr><td style="font-size:12px;line-height:1.6;color:#8a96b0;text-align:center">Se você não pediu este acesso, ignore este e-mail. Ninguém entra sem este código.</td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
